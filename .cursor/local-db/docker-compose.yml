services:
  postgres:
    image: postgres:17
    network_mode: host
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: main
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d main -h 127.0.0.1"]
      interval: 3s
      timeout: 3s
      retries: 20

  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    network_mode: host
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@127.0.0.1:5432/main
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
