services:
  postgres:
    image: postgres:17
    network_mode: host
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: main
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d main -h 127.0.0.1"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Neon-compatible proxy so the unmodified @neondatabase/serverless driver can
  # reach the local Postgres. The proxy's TLS listener is bound directly on 443
  # (host networking) to match the driver's default endpoints, so no client
  # code changes and no extra TLS forwarder are required.
  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    network_mode: host
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@127.0.0.1:5432/main
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        until psql -Atx "$$PG_CONNECTION_STRING" -c "SELECT 1" >/dev/null 2>&1; do sleep 1; done
        psql -Atx "$$PG_CONNECTION_STRING" \
          -c "CREATE SCHEMA IF NOT EXISTS neon_control_plane" \
          -c "CREATE TABLE IF NOT EXISTS neon_control_plane.endpoints (endpoint_id VARCHAR(255) PRIMARY KEY, allowed_ips VARCHAR(255))"
        exec ./neon-proxy -c server.pem -k server.key \
          --auth-backend=postgres \
          --auth-endpoint="$$PG_CONNECTION_STRING" \
          --wss=0.0.0.0:443
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
